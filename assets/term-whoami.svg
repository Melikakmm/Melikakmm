<text x="22" y="191" xml:space="preserve"><tspan fill="#00ffa3">melika@ucph</tspan><tspan fill="#dbe4ec">:</tspan><tspan fill="#56d4dd">~</tspan><tspan fill="#dbe4ec">$ </tspan><tspan fill="#dbe4ec">whoami</tspan></text>
<text x="22" y="212" xml:space="preserve"><tspan fill="#dbe4ec">PhD Fellow, DSDD Group — University of Copenhagen.</tspan></text>
<text x="22" y="233" xml:space="preserve"><tspan fill="#dbe4ec">Physicist by training. AI × protein person by accident. Chaos gremlin by default.</tspan></text>
<text x="22" y="275" xml:space="preserve"><tspan fill="#00ffa3">melika@ucph</tspan><tspan fill="#dbe4ec">:</tspan><tspan fill="#56d4dd">~</tspan><tspan fill="#dbe4ec">$ </tspan><tspan fill="#dbe4ec">cat origin_story.txt</tspan></text>
<text x="22" y="296" xml:space="preserve"><tspan fill="#dbe4ec">Started in theoretical physics &amp; pure math.</tspan></text>
<text x="22" y="317" xml:space="preserve"><tspan fill="#dbe4ec">Got distracted by neural networks around year 3.</tspan></text>
<text x="22" y="338" xml:space="preserve"><tspan fill="#dbe4ec">Now I build AI that stares at proteins until it understands them.</tspan></text>
<text x="22" y="359" xml:space="preserve"><tspan fill="#dbe4ec">No regrets. Some deadlines.</tspan></text>
<text x="22" y="401" xml:space="preserve"><tspan fill="#00ffa3">melika@ucph</tspan><tspan fill="#dbe4ec">:</tspan><tspan fill="#56d4dd">~</tspan><tspan fill="#dbe4ec">$ </tspan><tspan fill="#dbe4ec">ps aux | grep obsessions</tspan></text>

name: Update DeepJoke Output

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-joke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch a joke and regenerate the terminal SVG
        env:
          JOKE_API: "https://v2.jokeapi.dev/joke/Programming,Pun?type=single&safe-mode"
        run: |
          JOKE=$(curl -fsSL "$JOKE_API" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('joke','Segfault while looking for a joke. Try again tomorrow.'))")
          python3 - "$JOKE" <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from term_svg import build_svg, deepjoke_block

          joke = sys.argv[1].strip() or "Segfault while looking for a joke. Try again tomorrow."
          build_svg(deepjoke_block(joke), "assets/term-deepjoke.svg", title="deepjoke.sh — output")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/term-deepjoke.svg
          git diff --staged --quiet || git commit -m "chore: rotate DeepJoke output"
          git push
